name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, tests, build, routes, accessibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, unit tests
        run: npm run verify

      - name: Production build
        # Every page is generated here, so a content error that only shows up
        # when a page renders (a machine with no image, a broken guide) fails
        # the build rather than a visitor's request.
        run: npm run build

      - name: Unreachable-export scan
        # Informational: exits 0 by design. An unused export is a question for
        # a person, not a build failure, but it belongs in the log.
        run: npm run verify:reachable

      - name: Install Chromium for the accessibility audit
        run: npx playwright install --with-deps chromium

      - name: Start the production build
        run: |
          npm run start -- -p 3000 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:3000/en; then
              echo "server responding after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not respond within 60s"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Every page, link, image, redirect and header
        run: npm run verify:routes
        env:
          APP_URL: http://localhost:3000

      - name: Accessibility — WCAG 2.2 A and AA, both languages
        run: npm run verify:a11y
        env:
          APP_URL: http://localhost:3000

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
