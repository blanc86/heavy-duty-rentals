# Local development only. NOT a production deployment.
services:
  db:
    image: postgres:17-alpine
    container_name: hdr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hdr
      POSTGRES_PASSWORD: hdr_dev_password
      POSTGRES_DB: hdr
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5433:5432"
    volumes:
      - hdr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdr -d hdr"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hdr_pgdata:
